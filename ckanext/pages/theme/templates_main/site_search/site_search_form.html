{% block search_input %}
<form action="/site_search" class="search-form" method="get">
  <div>
    <label for="field-giant-search">
      Search Articles, News & Events
    </label>
  </div>

  <div class="input-group search-input-group">
    <input id="field-giant-search"
           type="text"
           class="form-control"
           name="q"
           value="{{ query }}"
           autocomplete="off"
           placeholder="{{ _('Search Articles, News & Events...') }}">

    {% block search_input_button %}
      <span class="input-group-btn">
        <button class="btn btn-default" type="submit" value="search">
          <i class="fa fa-search"></i>
        </button>
      </span>
    {% endblock %}
  </div>

  {# --- Order By dropdown --- #}
  <div class="form-group control-order-by" style="margin-top: 10px;">
    <label for="sort">{{ _('Order by:') }}</label>
    <select id="sort" name="sort" class="form-control" onchange="this.form.submit()">
      <option value="relevance" {% if sort == 'relevance' %}selected{% endif %}>{{ _('Relevance') }}</option>
      <option value="title_asc" {% if sort == 'title_asc' %}selected{% endif %}>{{ _('Title Ascending') }}</option>
      <option value="title_desc" {% if sort == 'title_desc' %}selected{% endif %}>{{ _('Title Descending') }}</option>
      <option value="date_newest" {% if sort == 'date_newest' %}selected{% endif %}>{{ _('Newest first') }}</option>
      <option value="date_oldest" {% if sort == 'date_oldest' %}selected{% endif %}>{{ _('Oldest first') }}</option>
    </select>
  </div>
</form>
{% endblock %}
